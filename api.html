<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Dashboard</title>

  <!-- CSS -->
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <!-- JS libs -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #salaryChart { width: 100%; height: 350px; margin-top: 20px; }
    #map { width: 100%; height: 400px; margin-top: 30px; }
  </style>
</head>
<body>
  <h2>Employee Dashboard</h2>

  <p id="loadingMessage">Loading...</p>

  <label for="dateRange">Pick a date range:</label>
  <input id="startDate" type="text" placeholder="mmddyy">
  <input id="endDate" type="text" placeholder="mmddyy">
  <button id="filterDateRange">Filter by Range</button>
  <button id="resetDate">Show All</button>

  <table id="empTable" class="display" width="100%"></table>

  <div id="salaryChart"></div>
  <div id="map"></div>

  <script>
    let employees = [];
    let dataTable, chart, map, markersLayer;

    $(document).ready(function(){
        // Load JSON data via AJAX
        $.getJSON("task4_data.json")
          .done(function(data){
              employees = data;
              $("#loadingMessage").hide();
              initDataTable(employees);
              initChart();
              updateChart(employees);
              initMap();
              plotCities(employees);
          })
          .fail(function(xhr, status, error){
              $("#loadingMessage").html("Error loading data: " + error);
              console.error("AJAX error:", xhr.status, status, error);
          });

        $("#startDate").datepicker({
            dateFormat:"mmddyy",
            onSelect: function(dateText) {
                $("#endDate").datepicker("option", "minDate", dateText);
            }
        });

        $("#endDate").datepicker({
            dateFormat:"mmddyy",
            onSelect: function(dateText) {
                $("#startDate").datepicker("option", "maxDate", dateText);
            }
        });

        $("#filterDateRange").on("click", filterByDateRange);
        $("#resetDate").on("click", resetFilter);
    });

    // Data Table
    function initDataTable(data){
        if(dataTable){ dataTable.destroy(); $("#empTable").empty(); }
        dataTable = $('#empTable').DataTable({
            data: data,
            columns: [
                {data:"id", title:"ID"},
                {data:"name", title:"Name"},
                {data:"department", title:"Department"},
                {data:"position", title:"Position"},
                {data:"hiredate", title:"Hire Date"},
                {data:"salary", title:"Salary"},
                {data:"city", title:"City"}
            ]
        });
    }

    // Chart
    function initChart(){
        chart = echarts.init(document.getElementById("salaryChart"));
        chart.setOption({
            title:{text:"Employee Salary Chart"},
            tooltip:{},
            xAxis: {type:'category', data:[], axisLabel: {interval: 0, rotate: 45, fontSize: 12}},
            yAxis: {type:'value'},
            series:[{type:'bar', data:[]}]
        });
    }
    function updateChart(list){
        chart.setOption({
            xAxis:{data:list.map(e=>e.name)},
            series:[{data:list.map(e=>e.salary)}]
        });
    }

    // Filter by date range
    function filterByDateRange(){
        let startDateStr = $("#startDate").val();
        let endDateStr = $("#endDate").val();

        if(!startDateStr || !endDateStr) {
            alert("Please select both start and end dates");
            return;
        }

        let start = $.datepicker.parseDate("mmddyy", startDateStr);
        let end = $.datepicker.parseDate("mmddyy", endDateStr);

        let filtered = employees.filter(e => {
            let hire = new Date(e.hiredate);
            return hire >= start && hire <= end;
        });

        initDataTable(filtered);
        updateChart(filtered);
        plotCities(filtered);
    }

    function resetFilter(){
        $("#startDate").val("");
        $("#endDate").val("");
        initDataTable(employees);
        updateChart(employees);
        plotCities(employees);
    }

    // Mapping
    const cityCoords = {
        "Chennai":[13.0827,80.2707],
        "Madurai":[9.9252,78.1198],
        "Virudhunagar":[9.5845,77.9579],
        "Sivakasi":[9.4550,77.7950],
        "Salem":[11.6643,78.1460],
        "Kochi":[9.9312,76.2673],
        "Nagercoil":[8.1833,77.4119],
        "Vellore":[12.9236,79.1331],
        "Thanjavur":[10.7877,79.1384],
        "Rajapalayam":[9.4515, 77.5543],
        "Srivilliputhur":[9.5121, 77.6340],
        "Aruppkottai":[9.5139, 78.1002]
    };
    function initMap(){
        map = L.map("map").setView([11,78],6);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
            maxZoom:18, attribution:"© OpenStreetMap"
        }).addTo(map);
        markersLayer = L.layerGroup().addTo(map);
    }
    function plotCities(list){
        markersLayer.clearLayers();
        const grouped = {};
        list.forEach(e=>{
            if(!grouped[e.city]) grouped[e.city] = [];
            grouped[e.city].push(e.name+" ("+e.salary+")");
        });
        Object.keys(grouped).forEach(city=>{
            const coords = cityCoords[city];
            if(coords){
                L.marker(coords).bindPopup(
                    "<b>"+city+"</b><br>"+grouped[city].join("<br>")
                ).addTo(markersLayer);
            }
        });
    }
  </script>
</body>
</html>
