<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataTables with Excel Upload</title>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- DataTables CSS & JS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <!-- DataTables Buttons Extension -->
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>

  <!-- DataTables Responsive -->
  <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">
  <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>

  <!-- SheetJS for reading Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>
  <h2>Upload Employee Excel File</h2>
  <input type="file" id="excelFile" accept=".xlsx, .xls" />

  <table id="employeeTable" class="display nowrap" style="width:100%">
    <thead>
      <tr id="tableHead"></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    let dataTable;

    document.getElementById('excelFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      const reader = new FileReader();

      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });

        // Read the first sheet
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];

        // Convert sheet to JSON
        const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1 });

        // Clear old table head & body
        document.getElementById("tableHead").innerHTML = "";
        document.getElementById("tableBody").innerHTML = "";

        // Build table header
        const headers = jsonData[0];
        headers.forEach(h => {
          document.getElementById("tableHead").innerHTML += `<th>${h}</th>`;
        });

        // Build table body
        for (let i = 1; i < jsonData.length; i++) {
          let row = "<tr>";
          jsonData[i].forEach(cell => {
            row += `<td>${cell || ""}</td>`;
          });
          row += "</tr>";
          document.getElementById("tableBody").innerHTML += row;
        }

        // Destroy old DataTable instance if exists
        if (dataTable) {
          dataTable.destroy();
        }

        // Initialize DataTable
        dataTable = $('#employeeTable').DataTable({
          responsive: true,
          dom: 'Bfrtip',
          buttons: ['copy', 'csv', 'excel', 'pdf', 'print']
        });
      };

      reader.readAsArrayBuffer(file);
    });
  </script>
</body>
</html>
