<!DOCTYPE html>
<html>
<head>
  <title>Leaflet Map</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    #map { width: 500px; height: 500px; } /* map height */
    
  </style>
</head>
<body>
  <div id="map"></div>
  

  <script>
    // Initialize map
    var map = L   .map('map').setView([13.0827, 80.2707], 10); // Chennai coords

    // Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Add marker
    L.marker([13.0827, 80.2707]).addTo(map)
      .bindPopup("<b>Hello!</b><br>Chennai City.")
      .openPopup();
      // Circle
L.circle([13.05, 80.25], {
  radius: 2000, // meters
  color: "red",
  fillColor: "#f03",
  fillOpacity: 0.5
}).addTo(map);

  </script>
</body>
</html>
